<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TaskFlow - To-Do List Mobile</title>
  <meta name="description" content="Gerenciador de tarefas mobile progressivo e moderno com suporte offline.">

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fontes Google: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="mobile-container">
    <!-- Top App Bar -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <div class="logo-box">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">TaskFlow</h1>
            <p id="current-date" class="date-subtitle">Hoje</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="btn-install" class="btn-install hidden" title="Instalar aplicativo">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Instalar</span>
          </button>
          <div id="offline-indicator" class="offline-badge hidden" title="Você está offline">
            <span>Offline</span>
          </div>
        </div>
      </div>

      <!-- Card de Progresso / Métricas -->
      <section class="progress-card">
        <div class="progress-info">
          <div>
            <span class="progress-label">Seu Progresso</span>
            <h2 id="progress-summary" class="progress-count">0 de 0 tarefas</h2>
          </div>
          <span id="progress-percentage" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
      </section>
    </header>

    <!-- Filtros e Busca -->
    <section class="controls-section">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar tarefas..." autocomplete="off">
        <button id="btn-clear-search" class="btn-clear hidden" aria-label="Limpar busca">&times;</button>
      </div>

      <nav class="filter-pills" aria-label="Filtro de tarefas">
        <button class="pill active" data-filter="all">Todas (<span id="count-all">0</span>)</button>
        <button class="pill" data-filter="pending">Pendentes (<span id="count-pending">0</span>)</button>
        <button class="pill" data-filter="completed">Concluídas (<span id="count-completed">0</span>)</button>
      </nav>
    </section>

    <!-- Lista de Tarefas -->
    <main class="tasks-main">
      <div id="tasks-list" class="tasks-list" role="list">
        <!-- Renderizado dinamicamente via JS -->
      </div>

      <!-- Estado Vazio -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h3 id="empty-title">Nenhuma tarefa encontrada</h3>
        <p id="empty-desc">Toque no botão "+" abaixo para adicionar sua primeira tarefa.</p>
      </div>
    </main>

    <!-- Barra Inferior com Ação Rápida -->
    <footer class="bottom-action-bar">
      <button id="btn-open-modal" class="fab-button" aria-label="Nova Tarefa">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Nova Tarefa</span>
      </button>
    </footer>

    <!-- Modal / Bottom Sheet para Adicionar Tarefa -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="modal-title">Nova Tarefa</h2>
          <button id="btn-close-modal" class="btn-close-sheet" aria-label="Fechar">&times;</button>
        </div>

        <form id="task-form" class="task-form">
          <div class="form-group">
            <label for="task-title-input">Descrição da Tarefa</label>
            <input 
              type="text" 
              id="task-title-input" 
              placeholder="Ex: Praticar responsividade PWA" 
              required 
              maxlength="120"
              autocomplete="off"
            >
          </div>

          <!-- Layout em Grid/Colunas para evitar rolagem excessiva -->
          <div class="form-grid">
            <div class="form-group">
              <label>Prioridade</label>
              <div class="segmented-control" id="priority-options">
                <label class="segment-label">
                  <input type="radio" name="priority" value="low" checked>
                  <span class="segment-pill low">Baixa</span>
                </label>
                <label class="segment-label">
                  <input type="radio" name="priority" value="medium">
                  <span class="segment-pill medium">Média</span>
                </label>
                <label class="segment-label">
                  <input type="radio" name="priority" value="high">
                  <span class="segment-pill high">Alta</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>Categoria</label>
              <div class="category-options" id="category-options">
                <label class="cat-pill">
                  <input type="radio" name="category" value="Estudo" checked>
                  <span>📚 Estudo</span>
                </label>
                <label class="cat-pill">
                  <input type="radio" name="category" value="Trabalho">
                  <span>💼 Trabalho</span>
                </label>
                <label class="cat-pill">
                  <input type="radio" name="category" value="Pessoal">
                  <span>🏠 Pessoal</span>
                </label>
                <label class="cat-pill">
                  <input type="radio" name="category" value="Saúde">
                  <span>⚡ Saúde</span>
                </label>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="btn-cancel-task" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-primary">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Salvar Tarefa</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
